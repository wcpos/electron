name: Setup Electron
description: Common setup for Electron app workflows

inputs:
  node-version:
    description: Version of Node.js to use
    default: "22"
  download-expo-artifact:
    description: Whether to download the expo-dist artifact (for publish workflows)
    default: "false"

runs:
  using: "composite"
  steps:
    - name: 🏗 Setup pnpm
      uses: pnpm/action-setup@v4

    - name: 🏗 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Keep the pnpm store holding patched rxdb-premium out of the Actions cache.
        # From setup-node v5, packageManager in package.json would otherwise enable auto-caching.
        package-manager-cache: false

    - name: 🔒 Assert the pnpm side-effects cache is off
      shell: bash
      run: |
        if [ "$(pnpm config get side-effects-cache)" != "false" ]; then
          echo "::error::pnpm side-effects cache must be off because postinstall patches rxdb-premium in place."
          exit 1
        fi

    - name: 📦 Download expo-dist artifact
      if: inputs.download-expo-artifact == 'true'
      uses: actions/download-artifact@v4
      with:
        name: expo-dist
        path: dist
