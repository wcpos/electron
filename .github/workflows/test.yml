name: Test

on:
  push:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗 Setup Electron
        uses: ./.github/actions/setup-electron

      - name: 🔒 CI cache guard
        run: node --test scripts/ci-cache-guard.test.mjs

      # Keeps next's base version in package.json ahead of main's (#483).
      - name: 🔒 Next-lane version guard
        if: github.base_ref == 'next' || github.ref_name == 'next'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/check-next-version.test.mjs
          node --test scripts/check-lane-version.test.mjs
          stable=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=main" -H "Accept: application/vnd.github.raw" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          node scripts/check-next-version.mjs "$(node -p "require('./package.json').version")" "$stable"

      - name: 🏗 Add RXDB_LICENSE_KEY to package.json
        env:
          RXDB_LICENSE_KEY: ${{ secrets.RXDB_LICENSE_KEY }}
        run: jq --arg license "$RXDB_LICENSE_KEY" '.accessTokens["rxdb-premium"] = $license' package.json > tmp.json && mv tmp.json package.json

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Test
        run: |
          pnpm lint
          pnpm exec tsc
          pnpm test
